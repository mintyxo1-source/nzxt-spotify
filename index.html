<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZXT Kraken Spotify Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container holding the spinning gradient border and the image */
    #border-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px; /* Controls border thickness */
    }

    /* Spinning gradient background element */
    #border-wrapper::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: var(--border-gradient, conic-gradient(#1db954, #ffffff, #1db954));
      animation: rotate 6s linear infinite;
      z-index: 1;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    #album-art {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 2;
    }

    #login-btn {
      background-color: #1db954;
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="border-wrapper">
    <a id="login-btn" href="#" style="display: none;">Connect Spotify</a>
    <img id="album-art" src="" alt="Album Art" crossorigin="anonymous" />
  </div>

  <script>
    const CLIENT_ID = '9b87c876f27945408aaa274242241d5c';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    async function redirectToAuth() {
      const verifier = generateRandomString(128);
      localStorage.setItem('code_verifier', verifier);
      const challenge = await generateCodeChallenge(verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function getAccessToken(code) {
      const verifier = localStorage.getItem('code_verifier');
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        initDisplay();
      }
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('spotify_refresh_token');
      if (!refreshToken) return false;

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        return true;
      }
      return false;
    }

    // Dynamic color extraction from the album cover image
    function updateBorderColors(imgElement) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 50;
      canvas.height = 50;

      ctx.drawImage(imgElement, 0, 0, 50, 50);
      const imageData = ctx.getImageData(0, 0, 50, 50).data;

      // Sample key areas of the image (top-left, center, bottom-right)
      const c1 = `rgb(${imageData[0]}, ${imageData[1]}, ${imageData[2]})`;
      const c2 = `rgb(${imageData[5000]}, ${imageData[5001]}, ${imageData[5002]})`;
      const c3 = `rgb(${imageData[9900]}, ${imageData[9901]}, ${imageData[9902]})`;

      const wrapper = document.getElementById('border-wrapper');
      wrapper.style.setProperty('--border-gradient', `conic-gradient(${c1}, ${c2}, ${c3}, ${c1})`);
    }

    async function fetchCurrentlyPlaying() {
      const token = localStorage.getItem('spotify_token');
      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 204 || response.status === 202) {
          document.getElementById('album-art').style.display = 'none';
          return;
        }

        if (response.status === 401) {
          const refreshed = await refreshAccessToken();
          if (!refreshed) {
            localStorage.clear();
            window.location.reload();
          }
          return;
        }

        const data = await response.json();
        if (data && data.item) {
          const albumArtUrl = data.item.album.images[0]?.url;
          if (albumArtUrl) {
            const artEl = document.getElementById('album-art');
            if (artEl.src !== albumArtUrl) {
              artEl.src = albumArtUrl;
            }
            artEl.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Error:', err);
      }
    }

    const artEl = document.getElementById('album-art');
    artEl.onload = () => {
      try {
        updateBorderColors(artEl);
      } catch (e) {
        console.log('Cross-origin canvas read prevented color extraction, using fallback gradient.');
      }
    };

    function initDisplay() {
      document.getElementById('login-btn').style.display = 'none';
      fetchCurrentlyPlaying();
      setInterval(fetchCurrentlyPlaying, 1000);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const token = localStorage.getItem('spotify_token');

    if (code) {
      getAccessToken(code);
    } else if (token) {
      initDisplay();
    } else {
      const loginBtn = document.getElementById('login-btn');
      loginBtn.style.display = 'inline-block';
      loginBtn.onclick = (e) => {
        e.preventDefault();
        redirectToAuth();
      };
    }
  </script>
</body>
</html>
