<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZXT Kraken Spotify Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      overflow: hidden;
    }

    /* Rotating background gradient for the border */
    .spinner {
      position: absolute;
      width: 250%;
      height: 250%;
      background: var(--border-gradient, conic-gradient(#1db954, #ffffff, #107c41, #1db954));
      animation: rotate 6s linear infinite;
      z-index: 1;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Mask keeping the border constrained to an 8px ring */
    .inner-box {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: hidden;
      text-align: center;
    }

    #album-art {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 3;
    }

    #login-btn {
      background-color: #1db954;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
    }

    #status-msg {
      font-size: 12px;
      color: #aaa;
      z-index: 10;
      padding: 10px;
    }

    #reset-link {
      position: absolute;
      bottom: 12px;
      font-size: 10px;
      color: #555;
      text-decoration: underline;
      cursor: pointer;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>

  <div class="screen-wrapper">
    <div class="spinner" id="spinner"></div>
    <div class="inner-box">
      <a id="login-btn" href="#" style="display: none;">Connect Spotify</a>
      <p id="status-msg">Connecting to Spotify...</p>
      <span id="reset-link" onclick="forceLogout()">Reset Session</span>
      <img id="album-art" src="" alt="Album Art" />
    </div>
  </div>

  <script>
    const CLIENT_ID = '9b87c876f27945408aaa274242241d5c';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    function forceLogout() {
      localStorage.clear();
      window.location.href = REDIRECT_URI;
    }

    // Allow URL reset via ?logout=true
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logout') === 'true') {
      forceLogout();
    }

    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    async function redirectToAuth() {
      const verifier = generateRandomString(128);
      localStorage.setItem('code_verifier', verifier);
      const challenge = await generateCodeChallenge(verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function getAccessToken(code) {
      const verifier = localStorage.getItem('code_verifier');
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        const data = await response.json();
        if (data.access_token) {
          localStorage.setItem('spotify_token', data.access_token);
          if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
          window.history.replaceState({}, document.title, REDIRECT_URI);
          initDisplay();
        } else {
          showLogin();
        }
      } catch (e) {
        showLogin();
      }
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('spotify_refresh_token');
      if (!refreshToken) return false;

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      });

      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        const data = await response.json();
        if (data.access_token) {
          localStorage.setItem('spotify_token', data.access_token);
          if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
          return true;
        }
      } catch (e) {
        console.error(e);
      }
      return false;
    }

    // Color extraction isolated in an independent sandbox
    function extractColorsSafe(imgUrl) {
      if (!imgUrl) return;
      const tempImg = new Image();
      tempImg.crossOrigin = 'Anonymous';
      
      tempImg.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 5;
          canvas.height = 5;
          ctx.drawImage(tempImg, 0, 0, 5, 5);
          const data = ctx.getImageData(0, 0, 5, 5).data;
          
          const c1 = `rgb(${data[0]}, ${data[1]}, ${data[2]})`;
          const c2 = `rgb(${data[20]}, ${data[21]}, ${data[22]})`;
          const c3 = `rgb(${data[40]}, ${data[41]}, ${data[42]})`;

          const spinner = document.getElementById('spinner');
          if (spinner) {
            spinner.style.setProperty('--border-gradient', `conic-gradient(${c1}, ${c2}, ${c3}, ${c1})`);
          }
        } catch (e) {
          // Default to green gradient on CORS restrictions
          document.getElementById('spinner').style.setProperty('--border-gradient', 'conic-gradient(#1db954, #ffffff, #107c41, #1db954)');
        }
      };

      tempImg.onerror = () => {
        document.getElementById('spinner').style.setProperty('--border-gradient', 'conic-gradient(#1db954, #ffffff, #107c41, #1db954)');
      };

      tempImg.src = imgUrl;
    }

    async function fetchCurrentlyPlaying() {
      const token = localStorage.getItem('spotify_token');
      if (!token) {
        showLogin();
        return;
      }

      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 204 || response.status === 202) {
          document.getElementById('album-art').style.display = 'none';
          document.getElementById('status-msg').style.display = 'block';
          document.getElementById('status-msg').innerText = 'Nothing Playing';
          document.getElementById('reset-link').style.display = 'inline';
          return;
        }

        if (response.status === 401) {
          const refreshed = await refreshAccessToken();
          if (!refreshed) {
            forceLogout();
          }
          return;
        }

        const data = await response.json();
        
        // Extract image URL across music tracks, podcasts, or fallback placeholder
        const albumArtUrl = data?.item?.album?.images?.[0]?.url 
          || data?.item?.show?.images?.[0]?.url 
          || 'https://i.scdn.co/image/ab67616d0000b2734e036e76ba29272826cf8d80';

        const artEl = document.getElementById('album-art');
        if (artEl.getAttribute('src') !== albumArtUrl) {
          artEl.src = albumArtUrl;
          extractColorsSafe(albumArtUrl);
        }
        
        artEl.style.display = 'block';
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('status-msg').style.display = 'none';
        document.getElementById('reset-link').style.display = 'none';

      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function showLogin() {
      document.getElementById('album-art').style.display = 'none';
      document.getElementById('status-msg').style.display = 'none';
      document.getElementById('reset-link').style.display = 'none';
      
      const loginBtn = document.getElementById('login-btn');
      loginBtn.style.display = 'inline-block';
      loginBtn.onclick = (e) => {
        e.preventDefault();
        redirectToAuth();
      };
    }

    function initDisplay() {
      document.getElementById('login-btn').style.display = 'none';
      fetchCurrentlyPlaying();
      setInterval(fetchCurrentlyPlaying, 1000);
    }

    const code = urlParams.get('code');
    const token = localStorage.getItem('spotify_token');

    if (code) {
      getAccessToken(code);
    } else if (token) {
      initDisplay();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
