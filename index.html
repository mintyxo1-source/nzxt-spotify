<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZXT Kraken Spotify Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      overflow: hidden;
    }

    .spinner {
      position: absolute;
      width: 250%;
      height: 250%;
      background: var(--border-gradient, conic-gradient(#1db954, #ffffff, #107c41, #1db954));
      animation: rotate 6s linear infinite;
      z-index: 1;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .inner-box {
      position: relative;
      width: calc(100vw - 16px); /* 8px border thickness on all sides */
      height: calc(100vh - 16px);
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: hidden;
    }

    #album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #login-btn {
      background-color: #1db954;
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="screen-wrapper">
    <div class="spinner" id="spinner"></div>
    <div class="inner-box">
      <a id="login-btn" href="#" style="display: none;">Connect Spotify</a>
      <img id="album-art" src="" alt="Album Art" />
    </div>
  </div>

  <script>
    const CLIENT_ID = '9b87c876f27945408aaa274242241d5c';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    async function redirectToAuth() {
      const verifier = generateRandomString(128);
      localStorage.setItem('code_verifier', verifier);
      const challenge = await generateCodeChallenge(verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function getAccessToken(code) {
      const verifier = localStorage.getItem('code_verifier');
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        initDisplay();
      }
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('spotify_refresh_token');
      if (!refreshToken) return false;

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        return true;
      }
      return false;
    }

    // Safely extract dominant colors in background without breaking image render
    function updateBorderColors(imgUrl) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.src = imgUrl;

      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 10;
          canvas.height = 10;
          ctx.drawImage(img, 0, 0, 10, 10);
          const data = ctx.getImageData(0, 0, 10, 10).data;

          const c1 = `rgb(${data[0]}, ${data[1]}, ${data[2]})`;
          const c2 = `rgb(${data[40]}, ${data[41]}, ${data[42]})`;
          const c3 = `rgb(${data[120]}, ${data[121]}, ${data[122]})`;

          document.getElementById('spinner').style.setProperty(
            '--border-gradient',
            `conic-gradient(${c1}, ${c2}, ${c3}, ${c1})`
          );
        } catch (e) {
          // Default fallback gradient if CORS blocks canvas read
          document.getElementById('spinner').style.setProperty(
            '--border-gradient',
            `conic-gradient(#1db954, #ffffff, #107c41, #1db954)`
          );
        }
      };
    }

    async function fetchCurrentlyPlaying() {
      const token = localStorage.getItem('spotify_token');
      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 204 || response.status === 202) {
          document.getElementById('album-art').style.display = 'none';
          return;
        }

        if (response.status === 401) {
          const refreshed = await refreshAccessToken();
          if (!refreshed) {
            localStorage.clear();
            showLogin();
          }
          return;
        }

        const data = await response.json();
        if (data && data.item) {
          const albumArtUrl = data.item.album.images[0]?.url;
          if (albumArtUrl) {
            const artEl = document.getElementById('album-art');
            if (artEl.src !== albumArtUrl) {
              artEl.src = albumArtUrl;
              updateBorderColors(albumArtUrl);
            }
            artEl.style.display = 'block';
            document.getElementById('login-btn').style.display = 'none';
          }
        }
      } catch (err) {
        console.error('Error:', err);
      }
    }

    function showLogin() {
      const loginBtn = document.getElementById('login-btn');
      loginBtn.style.display = 'inline-block';
      loginBtn.onclick = (e) => {
        e.preventDefault();
        redirectToAuth();
      };
    }

    function initDisplay() {
      document.getElementById('login-btn').style.display = 'none';
      fetchCurrentlyPlaying();
      setInterval(fetchCurrentlyPlaying, 1000);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const token = localStorage.getItem('spotify_token');

    if (code) {
      getAccessToken(code);
    } else if (token) {
      initDisplay();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
