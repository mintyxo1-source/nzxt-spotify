<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZXT Kraken Spotify Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }
    #album-art {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      margin-bottom: 12px;
      object-fit: cover;
    }
    #track-name {
      font-size: 15px;
      font-weight: 700;
      width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    #artist-name {
      font-size: 12px;
      color: #b3b3b3;
      width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #login-btn {
      background-color: #1db954;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="content">
    <a id="login-btn" href="#" style="display: none;">Connect Spotify</a>
    <img id="album-art" src="" alt="Album Art" style="display: none;" />
    <div id="track-name">Checking playback...</div>
    <div id="artist-name"></div>
  </div>

  <script>
    // Your Spotify Client ID added below in quotes
    const CLIENT_ID = '9b87c876f27945408aaa274242241d5c';
    
    // Automatically uses your GitHub Pages / hosted URL as the redirect destination
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = ['user-read-currently-playing', 'user-read-playback-state'];

    function getAccessTokenFromUrl() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    let accessToken = getAccessTokenFromUrl();

    if (accessToken) {
      window.location.hash = '';
      localStorage.setItem('spotify_token', accessToken);
    } else {
      accessToken = localStorage.getItem('spotify_token');
    }

    const loginBtn = document.getElementById('login-btn');
    if (!accessToken) {
      const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES.join(' '))}`;
      loginBtn.href = authUrl;
      loginBtn.style.display = 'inline-block';
      document.getElementById('track-name').innerText = 'Setup Required';
    } else {
      loginBtn.style.display = 'none';
      fetchCurrentlyPlaying();
      setInterval(fetchCurrentlyPlaying, 3000);
    }

    async function fetchCurrentlyPlaying() {
      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });

        if (response.status === 204 || response.status === 202) {
          document.getElementById('track-name').innerText = 'Nothing Playing';
          document.getElementById('artist-name').innerText = 'Spotify';
          document.getElementById('album-art').style.display = 'none';
          return;
        }

        if (response.status === 401) {
          localStorage.removeItem('spotify_token');
          window.location.reload();
          return;
        }

        const data = await response.json();

        if (data && data.item) {
          const trackName = data.item.name;
          const artistName = data.item.artists.map(a => a.name).join(', ');
          const albumArtUrl = data.item.album.images[0]?.url;

          document.getElementById('track-name').innerText = trackName;
          document.getElementById('artist-name').innerText = artistName;

          if (albumArtUrl) {
            const artEl = document.getElementById('album-art');
            artEl.src = albumArtUrl;
            artEl.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Error fetching track:', err);
      }
    }
  </script>
</body>
</html>
