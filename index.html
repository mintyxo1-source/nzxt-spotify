<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZXT Kraken Spotify Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }
    #album-art {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      margin-bottom: 12px;
      object-fit: cover;
    }
    #track-name {
      font-size: 15px;
      font-weight: 700;
      width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    #artist-name {
      font-size: 12px;
      color: #b3b3b3;
      width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #login-btn {
      background-color: #1db954;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="content">
    <a id="login-btn" href="#" style="display: none;">Connect Spotify</a>
    <img id="album-art" src="" alt="Album Art" style="display: none;" />
    <div id="track-name">Loading...</div>
    <div id="artist-name"></div>
  </div>

  <script>
    const CLIENT_ID = '9b87c876f27945408aaa274242241d5c';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    // Helper utilities for PKCE challenge generation
    function generateRandomString(length) {
      let text = '';
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    async function redirectToAuth() {
      const verifier = generateRandomString(128);
      localStorage.setItem('code_verifier', verifier);
      const challenge = await generateCodeChallenge(verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function getAccessToken(code) {
      const verifier = localStorage.getItem('code_verifier');
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        initDisplay();
      }
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('spotify_refresh_token');
      if (!refreshToken) return false;

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        return true;
      }
      return false;
    }

    async function fetchCurrentlyPlaying() {
      const token = localStorage.getItem('spotify_token');
      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 204 || response.status === 202) {
          document.getElementById('track-name').innerText = 'Nothing Playing';
          document.getElementById('artist-name').innerText = 'Spotify';
          document.getElementById('album-art').style.display = 'none';
          return;
        }

        if (response.status === 401) {
          const refreshed = await refreshAccessToken();
          if (!refreshed) {
            localStorage.clear();
            window.location.reload();
          }
          return;
        }

        const data = await response.json();
        if (data && data.item) {
          document.getElementById('track-name').innerText = data.item.name;
          document.getElementById('artist-name').innerText = data.item.artists.map(a => a.name).join(', ');
          const albumArtUrl = data.item.album.images[0]?.url;
          if (albumArtUrl) {
            const artEl = document.getElementById('album-art');
            artEl.src = albumArtUrl;
            artEl.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Error:', err);
      }
    }

    function initDisplay() {
      document.getElementById('login-btn').style.display = 'none';
      fetchCurrentlyPlaying();
      setInterval(fetchCurrentlyPlaying, 3000);
    }

    // Main execution flow
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const token = localStorage.getItem('spotify_token');

    if (code) {
      getAccessToken(code);
    } else if (token) {
      initDisplay();
    } else {
      const loginBtn = document.getElementById('login-btn');
      loginBtn.style.display = 'inline-block';
      loginBtn.onclick = (e) => {
        e.preventDefault();
        redirectToAuth();
      };
      document.getElementById('track-name').innerText = 'Setup Required';
    }
  </script>
</body>
</html>
